name: Sync Docker Images to ACR

on:   :
  workflow_dispatch:  # 手动触发   workflow_dispatch:  # Manually triggered

jobs:   工作:
  sync:   同步:
    runs-on: ubuntu-latest   运行于：ubuntu-latest
    steps:   步骤:
      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: crpi-aux7x4ompgkgj165.cn-heyuan.personal.cr.aliyuncs.com
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Pull and push bitnami/postgresql
        run: |
          docker pull bitnami/postgresql:latest
          docker tag bitnami/postgresql:latest crpi-aux7x4ompgkgj165.cn-heyuan.personal.cr.aliyuncs.com/gitlab/postgresql:latest
          docker push crpi-aux7x4ompgkgj165.cn-heyuan.personal.cr.aliyuncs.com/gitlab/postgresql:latest

      - name: Pull and push bitnami/redis
        run: |
          docker pull bitnami/redis:latest
          docker tag bitnami/redis:latest crpi-aux7x4ompgkgj165.cn-heyuan.personal.cr.aliyuncs.com/gitlab/redis:latest
          docker push crpi-aux7x4ompgkgj165.cn-heyuan.personal.cr.aliyuncs.com/gitlab/redis:latest

      - name: Pull and push gitlab-ce
        run: |
          docker pull gitlab/gitlab-ce:latest
          docker tag gitlab/gitlab-ce:latest crpi-aux7x4ompgkgj165.cn-heyuan.personal.cr.aliyuncs.com/gitlab/gitlab-ce:latest
          docker push crpi-aux7x4ompgkgj165.cn-heyuan.personal.cr.aliyuncs.com/gitlab/gitlab-ce:latest
