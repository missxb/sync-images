name: Sync Bitnami Images to ACR for GitLab

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: crpi-aux7x4ompgkgj165.cn-heyuan.personal.cr.aliyuncs.com
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Sync bitnami images from bitnamilegacy
        run: |
          set -e
          ACR="crpi-aux7x4ompgkgj165.cn-heyuan.personal.cr.aliyuncs.com/gitlab"

          # GitLab Helm Chart 8.0.0 - exact bitnami image tags from chart values
          IMAGES=(
            "bitnamilegacy/postgresql:15.3.0-debian-11-r0:postgresql:15.3.0-debian-11-r0"
            "bitnamilegacy/bitnami-shell:11-debian-11-r115:bitnami-shell:11-debian-11-r115"
            "bitnamilegacy/postgres-exporter:0.12.0-debian-11-r86:postgres-exporter:0.12.0-debian-11-r86"
            "bitnamilegacy/redis:6.2.7-debian-11-r11:redis:6.2.7-debian-11-r11"
            "bitnamilegacy/redis-sentinel:6.2.7-debian-11-r12:redis-sentinel:6.2.7-debian-11-r12"
            "bitnamilegacy/redis-exporter:1.43.0-debian-11-r4:redis-exporter:1.43.0-debian-11-r4"
            "bitnamilegacy/bitnami-shell:11-debian-11-r11:bitnami-shell:11-debian-11-r11"
          )

          echo "=========================================="
          echo "Syncing ${#IMAGES[@]} images to ACR"
          echo "=========================================="

          FAILED=()
          SUCCESS=0

          for ITEM in "${IMAGES[@]}"; do
            SRC=$(echo "$ITEM" | cut -d: -f1-3)
            DST_NAME=$(echo "$ITEM" | cut -d: -f4)
            DST_TAG=$(echo "$ITEM" | cut -d: -f5-)
            DST="${ACR}/${DST_NAME}:${DST_TAG}"

            echo ""
            echo ">>> Pulling: docker.io/${SRC}"
            if docker pull "docker.io/${SRC}"; then
              echo ">>> Tagging: ${DST}"
              docker tag "docker.io/${SRC}" "${DST}"
              echo ">>> Pushing: ${DST}"
              if docker push "${DST}"; then
                echo ">>> OK: ${SRC} -> ${DST}"
                SUCCESS=$((SUCCESS + 1))
              else
                echo ">>> FAIL push: ${DST}"
                FAILED+=("${SRC}")
              fi
            else
              echo ">>> FAIL pull: ${SRC}"
              FAILED+=("${SRC}")
            fi
          done

          echo ""
          echo "=========================================="
          echo "Done: ${SUCCESS} ok, ${#FAILED[@]} failed"
          if [ ${#FAILED[@]} -gt 0 ]; then
            echo "Failed images:"
            for f in "${FAILED[@]}"; do
              echo "  - ${f}"
            done
            exit 1
          fi
          echo "=========================================="
