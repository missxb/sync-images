name   名字: Sync Bitnami Images to ACR for GitLab

on:   :
  workflow_dispatch:

jobs:   工作:
  sync:   同步:
    runs-on: ubuntu-latest   运行于：ubuntu-latest
    steps:   步骤:
      - name: Login to ACR   - 名称：登录 ACR
        uses: docker/login-action@v3使用：docker/login-action@v3
        with:   :
          registry: crpi-aux7x4ompgkgj165.cn-heyuan.personal.cr.aliyuncs.com注册表：crpi-aux7x4ompgkgj165.cn-heyuan.personal.cr.aliyuncs.com
          username: ${{ secrets.ACR_USERNAME }}用户名：${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}密码：${{ secrets.ACR_PASSWORD }}

      - name: Sync bitnami images from bitnamilegacy
        run: |   运行:|
          set -e

          ACR="crpi-aux7x4ompgkgj165.cn-heyuan.personal.cr.aliyuncs.com/gitlab"

          # ============================================================
          # GitLab Helm Chart 8.0.0 所需的 bitnami 镜像
          # 来源: bitnamilegacy (Bitnami 2025.8.28 策略变更后版本标签迁移至此)
          # ============================================================

          declare -A IMAGES=(
            # --- PostgreSQL (bitnami chart 12.5.2) ---
            ["bitnamilegacy/postgresql:16.1.0-debian-12-r14"]="postgresql:16.1.0-debian-12-r14"
            ["bitnamilegacy/postgresql:16.1.0-debian-12-r14"]="postgresql:16.1.0-debian-12-r14"

            # --- Redis (bitnami chart 16.13.2) ---
            ["bitnamilegacy/redis:7.4.2-debian-12-r14"]="redis:7.4.2-debian-12-r14"

            # --- Redis Sentinel (redis chart 依赖) ---
            ["bitnamilegacy/redis-sentinel:7.4.2-debian-12-r14"]="redis-sentinel:7.4.2-debian-12-r14"

            # --- MinIO (GitLab Registry 对象存储) ---
            ["bitnamilegacy/minio:2024.11.7-debian-12-r0"]="minio:2024.11.7-debian-12-r0"

            # --- Registry (GitLab Container Registry) ---
            ["bitnamilegacy/docker-registry:2.8.3-debian-12-r6"]="docker-registry:2.8.3-debian-12-r6"

            # --- os-shell (bitnami 通用 initContainer) ---
            ["bitnamilegacy/os-shell:12-debian-12-r24"]="os-shell:12-debian-12-r24"

            # --- postgres-exporter (PostgreSQL 监控指标) ---
            ["bitnamilegacy/postgres-exporter:0.15.0-debian-12-r18"]="postgres-exporter:0.15.0-debian-12-r18"

            # --- redis-exporter (Redis 监控指标) ---
            ["bitnamilegacy/redis-exporter:1.58.0-debian-12-r14"]="redis-exporter:1.58.0-debian-12-r14"
          )

          echo "=========================================="
          echo "开始同步 ${#IMAGES[@]} 个镜像到 ACR"
          echo "=========================================="

          FAILED=()
          SUCCESS=0

          for SRC in "${!IMAGES[@]}"; do
            DST_TAG="${IMAGES[$SRC]}"
            DST="${ACR}:${DST_TAG}"

            echo ""
            echo ">>> 拉取: docker.io/${SRC}"
            if docker pull "docker.io/${SRC}"; then
              echo ">>> 打标签: ${DST}"
              docker tag "docker.io/${SRC}" "${DST}"
              echo ">>> 推送: ${DST}"
              if docker push "${DST}"; then
                echo ">>> ✅ 成功: ${SRC} -> ${DST}"
                SUCCESS=$((SUCCESS + 1))
              else
                echo ">>> ❌ 推送失败: ${DST}"
                FAILED+=("${SRC} (push failed)")
              fi
            else
              echo ">>> ❌ 拉取失败: ${SRC}"
              FAILED+=("${SRC} (pull failed)")
            fi
          done

          echo ""
          echo "=========================================="
          echo "同步完成: 成功 ${SUCCESS}, 失败 ${#FAILED[@]}"
          if [ ${#FAILED[@]} -gt 0 ]; then
            echo "失败的镜像:"
            for f in "${FAILED[@]}"; do
              echo "  - ${f}"
            done
            exit 1
          fi
          echo "=========================================="
